<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <!DOCTYPE html>
<html>
<head>
    <title>Enquiry - Noshimza Corner</title>
</head>

<body>

    <header>
        <h1>Make an Enquiry</h1>
        <p>Contact us about meals, orders or bookings</p>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About Us</a> |
        <a href="menu.html">Menu</a> |
        <a href="enquiry.html">Enquiry</a> |
        <a href="contact.html">Contact Us</a>
    </nav>

    <hr>

    <main>

        <h2>Customer Enquiry Form</h2>

        <form>

            <label for="name">Full Name:</label>
            <br>
            <input type="text" id="name" name="name">
            <br><br>

            <label for="email">Email Address:</label>
            <br>
            <input type="email" id="email" name="email">
            <br><br>

            <label for="phone">Phone Number:</label>
            <br>
            <input type="tel" id="phone" name="phone">
            <br><br>

            <label for="enquiry">Type of Enquiry:</label>
            <br>

            <select id="enquiry" name="enquiry">

                <option value="general">General Enquiry</option>
                <option value="order">Food Order</option>
                <option value="booking">Table Booking</option>
                <option value="catering">Catering</option>
                <option value="complaint">Complaint</option>

            </select>

            <br><br>

            <label for="message">Your Message:</label>
            <br>

            <textarea id="message" name="message" rows="8" cols="40"></textarea>

            <br><br>

            <input type="submit" value="Submit Enquiry">
            <input type="reset" value="Clear Form">

        </form>

    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Noshimza Corner. All Rights Reserved.</p>
    </footer>

</body>
</html>
